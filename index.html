<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/jj.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Jerin Jack · Software Engineer. I find the hot frames: Java, Spring Boot, Kafka, and databases tuned until they behave."
    />
    <title>Jerin Jack portfolio</title>
    <script>
      /* Apply the saved theme before first paint: no flash of the wrong one. */
      (function () {
        try {
          var t = window.localStorage.getItem("jj-theme");
          if (t !== "dark" && t !== "light") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          if (t === "dark") {
            document.documentElement.classList.add("dark");
            document.documentElement.style.backgroundColor = "#171410";
          }
        } catch (e) {
          /* no storage, no problem: light theme */
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
